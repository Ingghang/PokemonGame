<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Battle UI</title>
    <link rel="icon" href="img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="style.css" >
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#0F172A;
            color: black;
            line-height:1.6;
        }
        /* ---------- HEADER ---------- */

        .header{
            position:sticky;
            top:0;
            background:#111827;
            z-index:999;
            border-bottom:1px solid #1F2937;
        }

        .navbar{
            max-width:1200px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:1rem;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:10px;
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        .logo img{
            border-radius:50%;
        }

        .nav-links{
            display:flex;
            gap:1.5rem;
            list-style:none;
        }

        .nav-links a{
            color:#CBD5E1;
            text-decoration:none;
        }

        .nav-links a:hover,
        .nav-links a:focus{
            color:#FACC15;
        }

        .battleBody {
            display: flex;
            justify-content: center;
            align-items: center;
            /* min-height: 100vh; */
            margin: 0;
           
        } 

        .mainBorder {
            background-color: gray;
            width: 1000px;
            height: 800px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-radius: 20px;
            padding: 10px;
        }

        .upper {
            display: flex;
            width: 100%;
            height: 500px;
            position: relative;
            background-image: url("img/bbg.png");
            background-size: cover;
            background-position: center;
        }

        .upper p{
            font-size: 2rem;
            font-weight: 700;
            margin: 2px;
        }

        .pokemon1 {
            height: 250px;
            width: 250px;
            /* background-color: red; */
            position: absolute;
            top:50%;
            left:10%;
        }
        
        .pokemon1 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .pokemon1HP{
            display: flex;
            height: 100px;
            width: 500px;
            background-color: white;
            position: absolute;
            top:74%;
            right:1%;
            border-radius: 20px;
            border: black 5px solid;
            padding: 4px;
            flex-direction: column;
            justify-items: center;
            justify-content: center;
        }

        .p1hp_bg{
            width: 450px;
            height: 10px;
            background-color: black;
            border: gray 5px solid;
            border-radius: 20px;
        }

        .p1hp{
            width: 100%;
            height: 10px;
            background-color: green;
        }

        .pokemon2 {
            height: 250px;
            width: 250px;
            position:absolute;
            top:10%;
            right:10%;
        }

        .pokemon2 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .pokemon2HP{
            display: flex;
            height: 100px;
            width: 500px;
            background-color: white;
            position: absolute;
            top:2%;
            left:1%;
            border-radius: 20px;
            border: black 5px solid;
            padding: 4px;
            flex-direction: column;
            justify-items: center;
            justify-content: center;
        }

        .p2hp_bg{
            width: 450px;
            height: 10px;
            background-color: black;
            border: gray 5px solid;
            border-radius: 20px;
        }

        .p2hp{
            width: 100%;
            height: 10px;
            background-color: green;
        }

        .bottom {
            display: flex;
            width: 100%;
            background-color:#282a2e ;
            height: 300px;
            padding: 0px;
            border: 4px solid black;
        }

        .dialogueBorder {
            background-color: #214f6b;
            border: 5px solid #ceaa48;
            color: white;
            font-size: 3rem;
            width: 50%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }


        .actionBorder {
           
            width: 50%;
            height: 300px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
        }

        .FightActionBorder {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
            width: 50%;
            height: 300px;
            display:none;
        }

        .itemActionBorder {
            display:none;
            flex-direction: column;
            width: 50%;
            height: auto;
        }

        .itemActionBorder button {
            margin: 20px;
            padding: 20px;
        }
        button {
            border: 8px solid black;
            border-radius: 12px;
            background-color: red;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        .footer{
            color:#F8FAFC;
        }
        .screen { 
            display: block;
            width: 100%;
            max-width: 1000px; 
        }

         .screen.active { display: block; }
    </style>
</head>

<body>
       <!-- Header -->
    <header class="header">
        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html" class="logo">
                <img src="img/logo.webp"
                    alt="Pokémon Battle Simulator logo"
                    width="48"
                    height="48">
                <span>Pokémon Battle Simulator</span>
            </a>
        </nav>
    </header>
    <audio src="img/battleOST.mp3" autoplay loop></audio>
  <section id="battleScreen" class="screen" aria-label="Battle">
  <div class="mainBorder">
    <div class="upper">
      <div class="pokemonSlot pokemon1">
        <img id="p1Sprite" src="" alt="">
      </div>
      <div class="hpCard pokemon1HP">
        <p class="nameRow"><span id="p1Name"></span><span id="p1Level">Lv 50</span></p>
        <div class="hpBarBg"><div id="p1HpFill" class="hpBarFill"></div></div>
        <span id="p1HpText" class="hpText"></span>
      </div>

      <div class="pokemonSlot pokemon2">
        <img id="p2Sprite" src="" alt="">
      </div>
      <div class="hpCard pokemon2HP">
        <p class="nameRow"><span id="p2Name"></span><span id="p2Level">Lv 50</span></p>
        <div class="hpBarBg"><div id="p2HpFill" class="hpBarFill"></div></div>
        <span id="p2HpText" class="hpText"></span>
      </div>
    </div>

    <div class="bottom">
      <div class="dialogueBorder" id="dialoguePanel">
        <p id="dialogue" aria-live="polite">What will you do?</p>
      </div>

      <div class="panel visible" id="actionPanel">
        <button class="actionBtn" id="btnFight">Fight</button>
        <button class="actionBtn" id="btnPokemon">Pokémon</button>
        <button class="actionBtn" id="btnItem">Item</button>
        <button class="actionBtn" id="btnRun">Run</button>
      </div>

      <div class="panel" id="fightPanel"></div>

      <div class="panel list" id="pokemonPanel"></div>

      <div class="panel list" id="itemPanel">
        <button class="actionBtn" id="btnPotion">Potion x2</button>
        <button class="actionBtn" id="btnItemBack">Back</button>
      </div>
    </div>
  </div>
</section>

        <!-- Footer -->
    <footer class="footer">

        <p>&copy; 2026 Pokémon Battle Simulator.</p>

        <nav aria-label="Footer Navigation">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
        </nav>

    </footer>
</body>

    function Crit(){

    function oppdmg(){
    
        if (hp2==0){
            return
        }
        let charizardMove = charizard.moves[
            Math.floor(Math.random() * Pokemon[1].moves.length)
        ];

        console.log("Charizard used " + charizardMove.name);

        let basePower = charizardMove.power;
        let attackType = charizardMove.category;

        let spAttack = charizard.stats.spAttack;

            );
        } else {

                spAttack,

            );

        console.log("Damage:", dmg);

        }
        console.log("Pikachu HP:", hp1);
        return [hp1,crit,charizardMove.name];

    }

    function getDmg(basePower,attack,defense,stab,crit){
       let tmp =((22*basePower*(attack/defense))/50+2);
       if(stab==true){
            tmp=tmp*1.5;
       }
       if(crit==true){
            tmp=tmp*1.5;
       }
       return tmp;
    }

        if(fight==="grid"){

        } else if (item==="flex"){
         document.getElementById("itemActionPannel").style.display="none";

        document.getElementById("actionPannel").style.display="grid";
        document.getElementById("dialoguePannel").style.width="50%";

    }

    //no of potions
   let potionCount = 3;

            document.getElementById("dialoguePannel").style.width="100%";
