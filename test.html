<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Battle UI</title>
    <link rel="icon" href="img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="style.css" >
    <style>
        :root {
            --panel-bg: #282a2e;
            --dialogue-bg: #214f6b;
            --dialogue-border: #ceaa48;
            --hp-green: #4caf50;
            --hp-yellow: #f6c343;
            --hp-red: #e53935;
            --btn-red: #d64545;
            --btn-red-dark: #a83232;
        }
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family:Arial, Helvetica, sans-serif;
            background:#0F172A;
            color: black;
            line-height:1.6;
        }
/* ---------- HEADER ---------- */

.header {
    width: 100%;
    position: sticky;
    top: 0;
    left: 0;
    z-index: 999;
    background: #111827;
    border-bottom: 1px solid #1F2937;
}

.navbar {
    width: 100%;
    max-width: 1200px;
    min-height: 72px;
    margin: 0 auto;
    padding: 0.75rem 1rem;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    color: #fff;
    text-decoration: none;
    font-weight: 700;
    white-space: nowrap;
}

.logo img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 50%;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 1.5rem;

    margin: 0;
    padding: 0;
    list-style: none;
}

.nav-links a {
    color: #CBD5E1;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
}

.nav-links a:hover,
.nav-links a:focus-visible {
    color: #FACC15;
}

/* ---------- MOBILE HEADER ---------- */

@media (max-width: 768px) {

    .navbar {
        flex-direction: column;
        justify-content: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
    }

    .logo {
        font-size: 0.95rem;
    }

    .logo img {
        width: 40px;
        height: 40px;
    }

    .nav-links {
        gap: 1rem;
        font-size: 0.9rem;
    }
}

        .battleBody {
            display: flex;
            justify-content: center;
            align-items: center;
            /* min-height: 100vh; */
            margin: 0;
           
        } 

        .mainBorder {
            background-color: gray;
            width: 100%;
            aspect-ratio: 5 / 4;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            padding: 10px;
            overflow: hidden;
        }


        .upper {
            flex: 1 1 auto;
            display: flex;
            width: 100%;
            position: relative;
            background: url("img/bbg.png");
            background-repeat: no-repeat;
            background-size: cover;
            border-radius: 8px;
            overflow: hidden;
            min-height: 0;
        }

       .pokemonSlot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25));
        }

        .pokemon1 { top: 50%; left: 0%; }
        .pokemon2 { top: 5%; right: 0%; }

        .hpCard {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background-color: white;
            position: absolute;
            width: min(58%, 320px);
            border-radius: 14px;
            border: black 4px solid;
            padding: 8px 12px;
        }
        .hpCard p.nameRow { margin: 0; font-size: 1.1rem; font-weight: 700; display: flex; justify-content: space-between; }
        .hpCard .hpText { font-size: 0.75rem; font-weight: normal; color: #444; }

        .pokemon1HP { bottom: 6%; right: 2%; }
        .pokemon2HP { top: 4%; left: 2%; }

        .hpBarBg {
            width: 100%;
            height: 12px;
            background-color: #222;
            border: gray 3px solid;
            border-radius: 20px;
            overflow: hidden;
        }
        .hpBarFill {
            height: 100%;
            background-color: var(--hp-green);
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        .bottom {
            display: flex;
            width: 100%;
            background-color: var(--panel-bg);
            height: 34%;
            min-height: 150px;
            border: 4px solid black;
            border-radius: 0 0 10px 10px;
            margin-top: 8px;
        }

        .dialogueBorder {
            background-color: var(--dialogue-bg);
            border: 5px solid var(--dialogue-border);
            color: white;
            font-size: clamp(1rem, 2.4vw, 1.6rem);
            width: 50%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            transition: width 0.2s ease;
        }

        .panel {
            width: 50%;
            height: 100%;
            display: none;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .panel.visible { display: grid; }
        .panel.list { display: none; grid-template-columns: 1fr 1fr; }
        .panel.list.visible { display: grid; }

        
        button{
            cursor: pointer;
        }
        button.actionBtn {
            border: 5px solid black;
            border-radius: 10px;
            background-color: var(--btn-red);
            color: white;
            font-size: clamp(0.85rem, 2vw, 1.3rem);
            font-weight: bold;
        }
        button.actionBtn:hover:not(:disabled) { background-color: var(--btn-red-dark); }
        button.actionBtn:disabled { background-color: #6b6b6b; cursor: not-allowed; opacity: 0.6; }

        .startBattleBtn {
    display: block;
    margin: 18px auto 0;
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    color: white;
    background: var(--btn-red);
    border: 4px solid black;
    border-radius: 10px;
  }
  .startBattleBtn:hover:not(:disabled) { background: var(--btn-red-dark); }
  .startBattleBtn:disabled { background: #b7bec7; cursor: not-allowed; }

        .moveBtn { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; }
        .moveBtn .moveMeta { font-size: 0.65rem; font-weight: normal; opacity: 0.85; }

        .footer{
            color:#F8FAFC;
        }
        .screen { 
            display: none;
            width: 100%;
            max-width: 1000px; 
        }
    .screen.active { display: block; }
        .selectionPanel {
          background: white;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        }
          .selectionHeader p { margin: 0; font-weight: bold; color: #33475b; }

  .pokemonGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .pokemonCard {
    border: 3px solid #d8dde3;
    border-radius: 12px;
    background: #f7f9fb;
    padding: 10px;
    text-align: center;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .pokemonCard img { width: 90px; height: 90px; image-rendering: pixelated; }
  .pokemonCard .cardName { font-weight: bold; color: #33475b; margin: 4px 0; }
  .pokemonCard:hover { transform: translateY(-3px); }
  .pokemonCard.selected {
    border-color: #2f9bff;
    background: #e7f2ff;
  }
     
  .typeBadgeRow { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
  .typeBadge {
    font-size: 0.65rem;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    font-weight: bold;
  }
    </style>
</head>

    <header class="header">
        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html" class="logo">
                <img src="img/logo.webp"
                    alt="Pokémon Battle Simulator logo"
                    width="48"
                    height="48">
                <span>Pokémon Battle Simulator</span>
            </a>
        </nav>
    </header>
    <!-- <audio src="img/battleOST.mp3" autoplay loop></audio> -->
  
    <section id="selectionScreen" class="screen active" aria-label="Team selection">
  <div class="selectionPanel">
    <div class="selectionHeader">
      <p>Choose your team (1–6 Pokémon)</p>
      <p id="selectionCount">Selected: 0</p>
    </div>
    <div id="pokemonGrid" class="pokemonGrid" role="list"></div>
    <button id="startBattleBtn" class="startBattleBtn" disabled>Start Battle</button>
  </div>
</section>

<section id="battleScreen" class="screen" aria-label="Battle">
  <div class="mainBorder">
    <div class="upper">
      <div class="pokemonSlot pokemon1">
        <img id="p1Sprite" src="" alt="">
      </div>
      <div class="hpCard pokemon1HP">
        <p class="nameRow"><span id="p1Name"></span><span id="p1Level">Lv 50</span></p>
        <div class="hpBarBg"><div id="p1HpFill" class="hpBarFill"></div></div>
        <span id="p1HpText" class="hpText"></span>
      </div>

      <div class="pokemonSlot pokemon2">
        <img id="p2Sprite" src="" alt="">
      </div>
      <div class="hpCard pokemon2HP">
        <p class="nameRow"><span id="p2Name"></span><span id="p2Level">Lv 50</span></p>
        <div class="hpBarBg"><div id="p2HpFill" class="hpBarFill"></div></div>
        <span id="p2HpText" class="hpText"></span>
      </div>
    </div>

    <div class="bottom">
      <div class="dialogueBorder" id="dialoguePanel">
        <p id="dialogue" aria-live="polite">What will you do?</p>
      </div>

      <div class="panel visible" id="actionPanel">
        <button class="actionBtn" id="btnFight">Fight</button>
        <button class="actionBtn" id="btnPokemon">Pokémon</button>
        <button class="actionBtn" id="btnItem">Item</button>
        <button class="actionBtn" id="btnRun">Run</button>
      </div>

      <div class="panel" id="fightPanel"></div>

      <div class="panel list" id="pokemonPanel"></div>

      <div class="panel list" id="itemPanel">
        <button class="actionBtn" id="btnPotion">Potion x2</button>
        <button class="actionBtn" id="btnItemBack">Back</button>
      </div>
    </div>
  </div>
</section>

        <!-- Footer -->
    <footer class="footer">

        <p>&copy; 2026 Pokémon Battle Simulator.</p>

        <nav aria-label="Footer Navigation">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
        </nav>

    </footer>
</body>

function spriteUrl(id, facingBack) {
  const folder = facingBack ? "back/" : "";
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${folder}${id}.png`;
}


const selectedIds = new Set();
const MAX_TEAM_SIZE=6;
function renderSelectionGrid() {
  const grid = document.getElementById("pokemonGrid");
  grid.innerHTML = "";

  POKEMON_TEMPLATES.forEach((template) => {
    const card = document.createElement("button");
    card.className = "pokemonCard";
    card.setAttribute("role", "listitem");
    card.setAttribute("aria-pressed", selectedIds.has(template.id) ? "true" : "false"); //if pokemon is selecteed or not for accessibility software
    if (selectedIds.has(template.id)){ card.classList.add("selected");}

    const typeBadges = template.types
      .map((t) => `<span class="typeBadge" style="background:${TYPE_COLORS[t]}">${t}</span>`)
      .join("");

    card.innerHTML = `
      <img src="${spriteUrl(template.id, false)}" alt="${template.name}">
      <p class="cardName">${template.name}</p>
      <div class="typeBadgeRow">${typeBadges}</div>
    `;

    card.addEventListener("click", () => toggleSelection(template.id));
    grid.appendChild(card);
  });
}
function toggleSelection(id) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else if (selectedIds.size < MAX_TEAM_SIZE) {
    selectedIds.add(id);
  }
  renderSelectionGrid();
  updateSelectionUI();
}

function updateSelectionUI() {
  document.getElementById("selectionCount").textContent = `Selected: ${selectedIds.size} / 6`;
  document.getElementById("startBattleBtn").disabled = selectedIds.size === 0;
}
