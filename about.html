<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic SEO -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About the Developer | Pokémon Battle Simulator</title>

    <meta name="description"
        content="Learn more about the developer behind Pokémon Battle Simulator, their skills, projects, and passion for web development.">

    <meta name="keywords"
        content="Pokémon Battle Simulator Developer, Web Developer, Developer Portfolio, Pokémon Game Developer">

    <meta name="author" content="Pokémon Battle Simulator Developer">

    <!-- Open Graph -->
    <meta property="og:title" content="About the Developer | Pokémon Battle Simulator">
    <meta property="og:description"
        content="Meet the developer behind Pokémon Battle Simulator and explore their skills, projects, and web development journey.">
    <meta property="og:image" content="img/hero.webp">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" href="img/logo.webp" type="image/webp">

    <style>
        /* ---------- RESET ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0F172A;
            color: #F8FAFC;
            line-height: 1.6;
        }

        /* ---------- ACCESSIBILITY ---------- */

        .skip-link {
            position: absolute;
            left: -999px;
            top: 10px;
            background: #FACC15;
            color: #000;
            padding: 10px 18px;
            border-radius: 6px;
            z-index: 1000;
        }

        .skip-link:focus {
            left: 10px;
        }

        /* ---------- HEADER ---------- */

        .header {
            position: sticky;
            top: 0;
            background: #111827;
            z-index: 999;
            border-bottom: 1px solid #1F2937;
        }

        .navbar {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .logo img {
            border-radius: 50%;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #CBD5E1;
            text-decoration: none;
            transition: .25s;
        }

        .nav-links a:hover,
        .nav-links a:focus {
            color: #FACC15;
        }

        /* ---------- HERO ---------- */

        .about-hero {
            max-width: 1200px;
            margin: auto;
            padding: 5rem 1rem;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            align-items: center;
            gap: 4rem;
        }

        .developer-image {
            display: flex;
            justify-content: center;
        }

        .developer-image img {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid #FACC15;
            box-shadow: 0 0 0 10px #1E293B;
        }

        .hero-text .eyebrow {
            color: #FACC15;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: .75rem;
        }

        .hero-text h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .hero-text h1 span {
            color: #FACC15;
        }

        .hero-text p {
            color: #CBD5E1;
            font-size: 1.1rem;
            max-width: 650px;
            margin-bottom: 1.5rem;
        }

        /* ---------- BUTTON ---------- */

        .cta-btn {
            display: inline-block;
            background: #FACC15;
            color: #111827;
            padding: 14px 28px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: bold;
            transition: .25s;
        }

        .cta-btn:hover,
        .cta-btn:focus {
            background: #FDE047;
            transform: translateY(-3px);
        }

        /* ---------- SECTION ---------- */

        .section {
            padding: 4rem 1rem;
        }

        .section-dark {
            background: #172033;
        }

        .section-heading {
            text-align: center;
            max-width: 750px;
            margin: 0 auto 2.5rem;
        }

        .section-heading h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: .75rem;
        }

        .section-heading p {
            color: #CBD5E1;
        }

        /* ---------- ABOUT ---------- */

        .about-content {
            max-width: 900px;
            margin: auto;
            text-align: center;
        }

        .about-content p {
            color: #CBD5E1;
            font-size: 1.05rem;
            margin-bottom: 1rem;
        }

        /* ---------- SKILLS ---------- */

        .skills-grid {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background: #1E293B;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid #334155;
            transition: .25s;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            border-color: #FACC15;
        }

        .skill-card h3 {
            color: #FACC15;
            margin-bottom: .75rem;
        }

        .skill-card p {
            color: #CBD5E1;
        }

        /* ---------- PROJECT ---------- */

        .project-grid {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            transition: .25s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: #FACC15;
        }

        .project-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            color: #FACC15;
            margin-bottom: .5rem;
        }

        .project-info p {
            color: #CBD5E1;
        }

        .project-tag {
            display: inline-block;
            margin-top: 1rem;
            padding: 5px 12px;
            background: #334155;
            color: #F8FAFC;
            border-radius: 999px;
            font-size: .85rem;
        }

        /* ---------- JOURNEY ---------- */

        .journey {
            max-width: 900px;
            margin: auto;
        }

        .timeline-item {
            position: relative;
            padding: 0 0 2rem 2rem;
            border-left: 2px solid #334155;
        }

        .timeline-item:last-child {
            border-left: 2px solid transparent;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -7px;
            top: 5px;
            width: 12px;
            height: 12px;
            background: #FACC15;
            border-radius: 50%;
        }

        .timeline-item h3 {
            color: #FACC15;
            margin-bottom: .4rem;
        }

        .timeline-item p {
            color: #CBD5E1;
        }

        /* ---------- CTA ---------- */

        .cta-section {
            padding: 5rem 1rem;
            background: #172033;
            text-align: center;
            border-top: 1px solid #334155;
            border-bottom: 1px solid #334155;
        }

        .cta-content {
            max-width: 800px;
            margin: auto;
        }

        .cta-content h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .cta-content p {
            max-width: 650px;
            margin: 0 auto 2rem;
            color: #CBD5E1;
            font-size: 1.1rem;
        }

        /* ---------- FOOTER ---------- */

        .footer {
            padding: 2rem 1rem;
            background: #111827;
            text-align: center;
            border-top: 1px solid #1F2937;
        }

        .footer nav {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer a {
            color: #CBD5E1;
            text-decoration: none;
        }

        .footer a:hover,
        .footer a:focus {
            color: #FACC15;
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-links {
                gap: 1rem;
            }

            .about-hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding-top: 3rem;
            }

            .developer-image {
                order: -1;
            }

            .developer-image img {
                width: 220px;
                height: 220px;
            }

            .hero-text p {
                margin-left: auto;
                margin-right: auto;
            }
        }

        @media (max-width: 480px) {

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .about-hero {
                padding: 3rem 1rem;
            }

            .developer-image img {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>

    <!-- Skip Link -->
    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <!-- Header -->
    <header class="header">

        <nav class="navbar" aria-label="Main Navigation">

            <a href="index.html" class="logo">
                <img src="img/logo.webp"
                    alt="Pokémon Battle Simulator logo"
                    width="48"
                    height="48">

                <span>Pokémon Battle Simulator</span>
            </a>

            <ul class="nav-links">
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="#skills">Skills</a>
                </li>

                <li>
                    <a href="#projects">Projects</a>
                </li>

                <li>
                    <a href="contact.html">Contact</a>
                </li>
            </ul>

        </nav>

    </header>



    <!-- Footer -->
    <footer class="footer">

        <p>
            &copy; 2026 Pokémon Battle Simulator.
        </p>

        <nav aria-label="Footer Navigation">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="#">
                Privacy
            </a>

            <a href="#">
                Terms
            </a>

        </nav>

    </footer>

</body>
</html>
