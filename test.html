<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Battle UI</title>
    <link rel="icon" href="img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="style.css" >
    <style>
        :root {
            --panel-bg: #282a2e;
            --dialogue-bg: #214f6b;
            --dialogue-border: #ceaa48;
            --hp-green: #4caf50;
            --hp-yellow: #f6c343;
            --hp-red: #e53935;
            --btn-red: #d64545;
            --btn-red-dark: #a83232;
        }
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family:Arial, Helvetica, sans-serif;
            background:#0F172A;
            color: black;
            line-height:1.6;
        }
/* ---------- HEADER ---------- */

.header {
    width: 100%;
    position: sticky;
    top: 0;
    left: 0;
    z-index: 999;
    background: #111827;
    border-bottom: 1px solid #1F2937;
}

.navbar {
    width: 100%;
    max-width: 1200px;
    min-height: 72px;
    margin: 0 auto;
    padding: 0.75rem 1rem;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    color: #fff;
    text-decoration: none;
    font-weight: 700;
    white-space: nowrap;
}

.logo img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 50%;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 1.5rem;

    margin: 0;
    padding: 0;
    list-style: none;
}

.nav-links a {
    color: #CBD5E1;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
}

.nav-links a:hover,
.nav-links a:focus-visible {
    color: #FACC15;
}

/* ---------- MOBILE HEADER ---------- */

@media (max-width: 768px) {

    .navbar {
        flex-direction: column;
        justify-content: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
    }

    .logo {
        font-size: 0.95rem;
    }

    .logo img {
        width: 40px;
        height: 40px;
    }

    .nav-links {
        gap: 1rem;
        font-size: 0.9rem;
    }
}

        .battleBody {
            display: flex;
            justify-content: center;
            align-items: center;
            /* min-height: 100vh; */
            margin: 0;
           
        } 

        .mainBorder {
            background-color: gray;
            width: 100%;
            aspect-ratio: 5 / 4;
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            padding: 10px;
            overflow: hidden;
        }


        .upper {
            flex: 1 1 auto;
            display: flex;
            width: 100%;
            position: relative;
            background: url("img/bbg.png");
            background-repeat: no-repeat;
            background-size: cover;
            border-radius: 8px;
            overflow: hidden;
            min-height: 0;
        }
          .pokemonSlot {
            height: 60%;
            width: 50%;
            position: absolute;
        
          }
       .pokemonSlot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25));
        }

        .pokemon1 { top: 50%; left: 0%; }
        .pokemon2 { top: 5%; right: 0%; }

        .hpCard {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background-color: white;
            position: absolute;
            width: min(58%, 320px);
            border-radius: 14px;
            border: black 4px solid;
            padding: 8px 12px;
        }
        .hpCard p.nameRow { margin: 0; font-size: 1.1rem; font-weight: 700; display: flex; justify-content: space-between; }
        .hpCard .hpText { font-size: 0.75rem; font-weight: normal; color: #444; }

        .pokemon1HP { bottom: 6%; right: 2%; }
        .pokemon2HP { top: 4%; left: 2%; }

        .hpBarBg {
            width: 100%;
            height: 12px;
            background-color: #222;
            border: gray 3px solid;
            border-radius: 20px;
            overflow: hidden;
        }
        .hpBarFill {
            height: 100%;
            background-color: var(--hp-green);
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        .bottom {
            display: flex;
            width: 100%;
            background-color: var(--panel-bg);
            height: 34%;
            min-height: 150px;
            border: 4px solid black;
            border-radius: 0 0 10px 10px;
            margin-top: 8px;
        }

        .dialogueBorder {
            background-color: var(--dialogue-bg);
            border: 5px solid var(--dialogue-border);
            color: white;
            font-size: clamp(1rem, 2.4vw, 1.6rem);
            width: 50%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            transition: width 0.2s ease;
        }

        .panel {
            width: 50%;
            height: 100%;
            display: none;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .panel.visible { display: grid; }
        .panel.list { display: none; grid-template-columns: 1fr 1fr; }
        .panel.list.visible { display: grid; }

        
        button{
            cursor: pointer;
        }
        button.actionBtn {
            border: 5px solid black;
            border-radius: 10px;
            background-color: var(--btn-red);
            color: white;
            font-size: clamp(0.85rem, 2vw, 1.3rem);
            font-weight: bold;
        }
        button.actionBtn:hover:not(:disabled) { background-color: var(--btn-red-dark); }
        button.actionBtn:disabled { background-color: #6b6b6b; cursor: not-allowed; opacity: 0.6; }

        .startBattleBtn {
    display: block;
    margin: 18px auto 0;
    padding: 12px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    color: white;
    background: var(--btn-red);
    border: 4px solid black;
    border-radius: 10px;
  }
  .startBattleBtn:hover:not(:disabled) { background: var(--btn-red-dark); }
  .startBattleBtn:disabled { background: #b7bec7; cursor: not-allowed; }

        .moveBtn { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; }
        .moveBtn .moveMeta { font-size: 0.65rem; font-weight: normal; opacity: 0.85; }

        .footer{
            color:#F8FAFC;
        }
        .screen { 
            display: none;
            width: 100%;
            max-width: 1000px; 
        }
    .screen.active { display: block; }
        .selectionPanel {
          background: white;
          border-radius: 16px;
          padding: 20px;
          box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        }
          .selectionHeader p { margin: 0; font-weight: bold; color: #33475b; }

  .pokemonGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .pokemonCard {
    border: 3px solid #d8dde3;
    border-radius: 12px;
    background: #f7f9fb;
    padding: 10px;
    text-align: center;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .pokemonCard img { width: 90px; height: 90px; image-rendering: pixelated; }
  .pokemonCard .cardName { font-weight: bold; color: #33475b; margin: 4px 0; }
  .pokemonCard:hover { transform: translateY(-3px); }
  .pokemonCard.selected {
    border-color: #2f9bff;
    background: #e7f2ff;
  }
     
  .typeBadgeRow { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
  .typeBadge {
    font-size: 0.65rem;
    color: white;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    font-weight: bold;
  }

   /* attack animations */
  @keyframes lungeForward {
    0% { transform: translateX(0); }
    40% { transform: translateX(var(--lunge-x, 24px)); }
    100% { transform: translateX(0); }
  }
  @keyframes hitFlash {
    0%, 100% { opacity: 1; filter: brightness(1); }
    25% { opacity: 0.3; filter: brightness(2.4); }
    50% { opacity: 1; filter: brightness(1); }
    75% { opacity: 0.3; filter: brightness(2.4); }
  }
  @keyframes faintDrop {
    to { transform: translateY(60px); opacity: 0; }
  }
  .anim-attacker { animation: lungeForward 0.35s ease; }
  .anim-hit { animation: hitFlash 0.35s ease; }
  .anim-faint { animation: faintDrop 0.6s ease forwards; }
    </style>
</head>

      <div class="panel" id="fightPanel"></div>

      <div class="panel list" id="pokemonPanel"></div>

      <div class="panel list" id="itemPanel">
        <button class="actionBtn" id="btnPotion">Potion x2</button>
        <button class="actionBtn" id="btnItemBack">Back</button>
      </div>
    </div>
  </div>
</section>

        <!-- Footer -->
    <footer class="footer">

        <p>&copy; 2026 Pokémon Battle Simulator.</p>

        <nav aria-label="Footer Navigation">
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Contact</a>
        </nav>

    </footer>
</body>

function spriteUrl(id, facingBack) {
  const folder = facingBack ? "back/" : "";
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${folder}${id}.png`;
}


const selectedIds = new Set();
const MAX_TEAM_SIZE=6;
const STARTING_POTIONS=2;
const POTION_HEAL_AMOUNT=30;
const CRIT_CHANCE = 0.0625; 
const MIN_RANDOM_FACTOR = 0.85;
function renderSelectionGrid() {
  const grid = document.getElementById("pokemonGrid");
  grid.innerHTML = "";

  POKEMON_TEMPLATES.forEach((template) => {
    const card = document.createElement("button");
    card.className = "pokemonCard";
    card.setAttribute("role", "listitem");
    card.setAttribute("aria-pressed", selectedIds.has(template.id) ? "true" : "false"); //if pokemon is selecteed or not for accessibility software
    if (selectedIds.has(template.id)){ card.classList.add("selected");}

    const typeBadges = template.types
      .map((t) => `<span class="typeBadge" style="background:${TYPE_COLORS[t]}">${t}</span>`)
      .join("");

    card.innerHTML = `
      <img src="${spriteUrl(template.id, false)}" alt="${template.name}">
      <p class="cardName">${template.name}</p>
      <div class="typeBadgeRow">${typeBadges}</div>
    `;

    card.addEventListener("click", () => toggleSelection(template.id));
    grid.appendChild(card);
  });
}
function toggleSelection(id) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else if (selectedIds.size < MAX_TEAM_SIZE) {
    selectedIds.add(id);
  }
  renderSelectionGrid();
  updateSelectionUI();
}

function updateSelectionUI() {
  document.getElementById("selectionCount").textContent = `Selected: ${selectedIds.size} / 6`;
  document.getElementById("startBattleBtn").disabled = selectedIds.size === 0;
}

renderSelectionGrid();
updateSelectionUI();

//color changing depending on hp
function hpBarColor(pokemon) {
  const ratio = pokemon.currentHp / pokemon.maxHp;
  if (ratio > 0.5) return "var(--hp-green)";
  if (ratio > 0.2) return "var(--hp-yellow)";
  return "var(--hp-red)";
}
document.getElementById("startBattleBtn").addEventListener("click", startBattle);

function createBattlePokemon(template) {
  
  const clone = structuredClone(template); // structuredClone another way to copy objects 
  return {
    ...clone,
    currentHp: clone.stats.hp,
    maxHp: clone.stats.hp,
    fainted: false
  };
}

    const chosen = pool.splice(randomIndex, 1)[0];
    console.log("chosen=",chosen)
    result.push(chosen);
  }

  return result;
}

function getActivePokemon(team, activeIndex) {
  return team[activeIndex];
}

function isTeamDefeated(team) {
  return team.every((pokemon) => pokemon.fainted);
}

function getNextHealthyIndex(team) {
  return team.findIndex((pokemon) => !pokemon.fainted);
}

function clamp (value, min, max) {return  Math.max(min, Math.min(max, value));}
function randomInt  (min, max) {return Math.floor(Math.random() * (max - min + 1)) + min;}
function pickRandom (array) { return  array[randomInt(0, array.length - 1)];}

const state = {
  playerTeam: [],
  enemyTeam: [],
  playerActive: 0,
  enemyActive: 0,
  potionCount: STARTING_POTIONS,
  battleOver: false,
  inputLocked: false
};

function chooseEnemyMove(enemyPokemon) {
  return pickRandom(enemyPokemon.moves);
}

function renderBattlers() {
  const player = getActivePokemon(state.playerTeam, state.playerActive);
  const enemy = getActivePokemon(state.enemyTeam, state.enemyActive);

  el.p1Sprite.src = spriteUrl(player.id, true);
  el.p1Sprite.alt = `${player.name}, your active Pokémon`;
  renderHpCard(player, el.p1Name, el.p1HpFill, el.p1HpText);

  el.p2Sprite.src = spriteUrl(enemy.id, false);
  el.p2Sprite.alt = `${enemy.name}, opponent's active Pokémon`;
  renderHpCard(enemy, el.p2Name, el.p2HpFill, el.p2HpText);
}

function renderHpCard(pokemon, nameEl, fillEl, textEl) {
  nameEl.textContent = pokemon.name;
  const percent = (pokemon.currentHp / pokemon.maxHp) * 100;
  fillEl.style.width = `${percent}%`;
  fillEl.style.backgroundColor = hpBarColor(pokemon);
  textEl.textContent = `${pokemon.currentHp} / ${pokemon.maxHp} HP`;
}

function startBattle() {
  const chosenTemplates = POKEMON_TEMPLATES.filter((t) => selectedIds.has(t.id));
  const enemyTemplates = sampleWithoutReplacement(POKEMON_TEMPLATES, chosenTemplates.length);

  state.playerTeam = chosenTemplates.map(createBattlePokemon);
  state.enemyTeam = enemyTemplates.map(createBattlePokemon);
  state.playerActive = 0;
  state.enemyActive = 0;
  state.potionCount = STARTING_POTIONS;
  state.battleOver = false;
  state.inputLocked = false;

  document.getElementById("selectionScreen").classList.remove("active");
  document.getElementById("battleScreen").classList.add("active");
  document.getElementById("mainOST").play();
  renderBattlers();
  
}

function showPanel(panelToShow) {
  [el.actionPanel, el.fightPanel, el.pokemonPanel, el.itemPanel].forEach((panel) => {
    panel.classList.remove("visible");
  });
  panelToShow.classList.add("visible");
  
}

function setPanelsEnabled(enabled) {
  document.querySelectorAll(".panel button").forEach((btn) => {
    btn.disabled = !enabled;
  });
}

function renderMoveButtons(onSelectMove) {
  const player = getActivePokemon(state.playerTeam, state.playerActive);
  el.fightPanel.innerHTML = "";

  player.moves.forEach((move) => {
    const button = document.createElement("button");
    button.className = "actionBtn moveBtn";
    button.style.backgroundColor = TYPE_COLORS[move.type] || "var(--btn-red)";
    button.innerHTML = `${move.name}<span class="moveMeta">${move.type} · ${move.category}</span>`;
    button.addEventListener("click", () => onSelectMove(move)); //onSelectMove is a call back function
    el.fightPanel.appendChild(button);
  });
  const backButton = document.createElement("button");
  backButton.className = "actionBtn";
  backButton.textContent = "Back";
  backButton.addEventListener("click", backToActionPanel);
  el.fightPanel.appendChild(backButton);
}

function renderPokemonRoster(onSelectSwitch, forcedSwitch) {
  el.pokemonPanel.innerHTML = "";

  state.playerTeam.forEach((pokemon, index) => {
    const card = document.createElement("button");
    card.className = "actionBtn rosterCard";
    const isActive = index === state.playerActive;
    card.disabled = pokemon.fainted || isActive;

    const percent = (pokemon.currentHp / pokemon.maxHp) * 100;
    card.innerHTML = `
      <img src="${spriteUrl(pokemon.id, false)}" alt="">
      <span class="rosterInfo">
        ${pokemon.name}${isActive ? " (active)" : ""}${pokemon.fainted ? " (fainted)" : ""}
        <span class="miniHpBg"><span class="miniHpFill" style="width:${percent}%; background:${hpBarColor(pokemon)}"></span></span>
      </span>
    `;
    card.addEventListener("click", () => onSelectSwitch(index));
    el.pokemonPanel.appendChild(card);
  });

  if (!forcedSwitch) {
    const backButton = document.createElement("button");
    backButton.className = "actionBtn";
    backButton.textContent = "Back";
    backButton.addEventListener("click", backToActionPanel);
    el.pokemonPanel.appendChild(backButton);
  }
}


function backToActionPanel() {
  showPanel(el.actionPanel);
  setDialogue("What will you do?");
}

function setDialogue(text) {
  el.dialogue.textContent = text;
}

function wait(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function applyDamage(pokemon, damage) {
  pokemon.currentHp = clamp(pokemon.currentHp - damage, 0, pokemon.maxHp);
  pokemon.fainted = pokemon.currentHp === 0;
  return pokemon.fainted;
}

function healPokemon(pokemon, amount) {
  pokemon.currentHp = clamp(pokemon.currentHp + amount, 0, pokemon.maxHp);
}

el.btnFight.addEventListener("click", () => {
  console.log("test")
  showPanel(el.fightPanel);
  renderMoveButtons(handlePlayerAttack);
});

el.btnPokemon.addEventListener("click", () => {
  showPanel(el.pokemonPanel);
  renderPokemonRoster(handlePlayerSwitch, false);
});

el.btnItem.addEventListener("click", () => {
  showPanel(el.itemPanel);
  el.btnPotion.textContent = `Potion x${state.potionCount}`;
  el.btnPotion.disabled = state.potionCount === 0;
});

el.btnItemBack.addEventListener("click", backToActionPanel);
el.btnPotion.addEventListener("click", () => handlePlayerItem());

el.btnRun.addEventListener("click", () => {
  setDialogue("You can't run from a Pokémon battle!");
});

async function handlePlayerAttack(move) {
  if (state.inputLocked) return;
  await runTurn({ type: "attack", move });
}

async function handlePlayerSwitch(index) {
  if (state.inputLocked) return;
  if (index === state.playerActive || state.playerTeam[index].fainted) return;
  const wasForced = getActivePokemon(state.playerTeam, state.playerActive).fainted;
  state.playerActive = index;
  renderBattlers();
  if (wasForced) {
    // A forced switch (after fainting) does not give the enemy a free hit;
    // the enemy already acted in the turn that caused the faint.
    backToActionPanel();
  } else {
    await runTurn({ type: "switch" });
  }
}
async function handlePlayerAttack(move) {
  if (state.inputLocked) return;
  await runTurn({ type: "attack", move });
}

async function handlePlayerItem() {
  if (state.inputLocked || state.potionCount === 0) return;
  await runTurn({ type: "item" });
}



function resolveTurnOrder(playerPokemon, playerMove, enemyPokemon, enemyMove) {
  if (playerMove.priority !== enemyMove.priority) {
    return playerMove.priority > enemyMove.priority ? "player" : "enemy";
  }
  if (playerPokemon.stats.speed !== enemyPokemon.stats.speed) {
    return playerPokemon.stats.speed > enemyPokemon.stats.speed ? "player" : "enemy";
  }
  return Math.random() < 0.5 ? "player" : "enemy";
}

function playAnimation(el, className) {
  return new Promise((resolve) => {
    const handleEnd = () => {
      el.classList.remove(className);
      el.removeEventListener("animationend", handleEnd);
      resolve();
    };
    el.addEventListener("animationend", handleEnd, { once: true });
    el.classList.add(className);
  });
}

async function runTurn(playerAction) {
  state.inputLocked = true;
  setPanelsEnabled(false);
  showPanel(el.actionPanel);

  const playerPokemon = getActivePokemon(state.playerTeam, state.playerActive);
  const enemyPokemon = getActivePokemon(state.enemyTeam, state.enemyActive);
  const enemyMove = chooseEnemyMove(enemyPokemon);

  if (playerAction.type === "item") {
    healPokemon(playerPokemon, POTION_HEAL_AMOUNT);
    state.potionCount--;
    renderBattlers();
    setDialogue(`You used a Potion on ${playerPokemon.name}!`);
    await wait(1000);
  } else if (playerAction.type === "switch") {
    setDialogue(`Go, ${playerPokemon.name}!`);
    await wait(900);
  } else {
    // Attack: whoever is faster (respecting move priority) goes first.
    const order = resolveTurnOrder(playerPokemon, playerAction.move, enemyPokemon, enemyMove);
    if (order === "player") {
      await executeMove(playerPokemon, enemyPokemon, playerAction.move, el.p1Slot, el.p2Slot, true);
      if (await handleFaintIfNeeded(enemyPokemon, false)) { finishTurn(); return; }
      await executeMove(enemyPokemon, playerPokemon, enemyMove, el.p2Slot, el.p1Slot, false);
      if (await handleFaintIfNeeded(playerPokemon, true)) { finishTurn(); return; }
    } else {
      await executeMove(enemyPokemon, playerPokemon, enemyMove, el.p2Slot, el.p1Slot, false);
      if (await handleFaintIfNeeded(playerPokemon, true)) { finishTurn(); return; }
      await executeMove(playerPokemon, enemyPokemon, playerAction.move, el.p1Slot, el.p2Slot, true);
      if (await handleFaintIfNeeded(enemyPokemon, false)) { finishTurn(); return; }
    }
    finishTurn();
    return;
  }

  // Non-attack player actions still give the opponent a turn.
  await executeMove(enemyPokemon, playerPokemon, enemyMove, el.p2Slot, el.p1Slot, false);
  if (await handleFaintIfNeeded(playerPokemon, true)) { finishTurn(); return; }
  finishTurn();
}

function renderPokemonRoster(onSelectSwitch, forcedSwitch) {
  el.pokemonPanel.innerHTML = "";

  state.playerTeam.forEach((pokemon, index) => {
    const card = document.createElement("button");
    card.className = "actionBtn rosterCard";
    const isActive = index === state.playerActive;
    card.disabled = pokemon.fainted || isActive;

    const percent = (pokemon.currentHp / pokemon.maxHp) * 100;
    card.innerHTML = `
      <img src="${spriteUrl(pokemon.id, false)}" alt="">
      <span class="rosterInfo">
        ${pokemon.name}${isActive ? " (active)" : ""}${pokemon.fainted ? " (fainted)" : ""}
        <span class="miniHpBg"><span class="miniHpFill" style="width:${percent}%; background:${hpBarColor(pokemon)}"></span></span>
      </span>
    `;
    card.addEventListener("click", () => onSelectSwitch(index));
    el.pokemonPanel.appendChild(card);
  });

  if (!forcedSwitch) {
    const backButton = document.createElement("button");
    backButton.className = "actionBtn";
    backButton.textContent = "Back";
    backButton.addEventListener("click", backToActionPanel);
    el.pokemonPanel.appendChild(backButton);
  }
}
// Returns true if the battle ended as a result of this faint.
async function handleFaintIfNeeded(pokemon, isPlayerPokemon) {
  if (!pokemon.fainted) return false;

  const slot = isPlayerPokemon ? el.p1Slot : el.p2Slot;
  setDialogue(`${pokemon.name} fainted!`);
  

  await wait(400);
 

  const team = isPlayerPokemon ? state.playerTeam : state.enemyTeam;
  if (isTeamDefeated(team)) {
    endBattle(!isPlayerPokemon);
    return true;
  }

  if (isPlayerPokemon) {
    setDialogue(`${pokemon.name} fainted! Choose your next Pokémon.`);
    state.inputLocked = false;
    setPanelsEnabled(true);
    showPanel(el.pokemonPanel);
    
  } else {
    state.enemyActive = getNextHealthyIndex(state.enemyTeam);
    renderBattlers();
    setDialogue(`The opponent sent out ${getActivePokemon(state.enemyTeam, state.enemyActive).name}!`);
    await wait(900);
  }
  return false;
}
function endBattle(playerWon) {
  state.battleOver = true;
  setDialogue(playerWon ? "You won the battle!" : "You lost the battle...");
  [el.actionPanel, el.fightPanel, el.pokemonPanel, el.itemPanel].forEach((p) => p.classList.remove("visible"));
  el.dialoguePanel.style.width = "100%";

  const restartButton = document.createElement("button");
  restartButton.className = "startBattleBtn";
  restartButton.textContent = "Back to Team Select";
  restartButton.style.margin = "12px auto 0";
  restartButton.addEventListener("click", () => {
    document.getElementById("battleScreen").classList.remove("active");
    document.getElementById("selectionScreen").classList.add("active");
    restartButton.remove();
  });
  el.dialoguePanel.appendChild(restartButton);
}
function finishTurn() {
  renderBattlers();
  state.inputLocked = false;
  setPanelsEnabled(true);
  backToActionPanel();
}
async function executeMove(attacker, defender, move, attackerSlot, defenderSlot, isPlayerAttacker) {
  setDialogue(`${attacker.name} used ${move.name}!`);
  await wait(500);
  await playAnimation(attackerSlot, "anim-attacker");

  const result = calculateDamage(attacker, defender, move);

  if (result.isStatus) {
    setDialogue(`${attacker.name} used ${move.name}, but nothing happened.`);
    await wait(900);
    return;
  }
  if (result.missed) {
    setDialogue(`${attacker.name}'s attack missed!`);
    await wait(900);
    return;
  }

  applyDamage(defender, result.damage);
  await playAnimation(defenderSlot, "anim-hit");
  renderBattlers();

  if (result.isCritical) {
    setDialogue("A critical hit!");
    await wait(700);
  }
}


function calculateDamage(attacker, defender, move) {
  if (move.power === 0) {
    return { damage: 0, isCritical: false, missed: false, isStatus: true };
  }

  const missed = Math.random() * 100 > move.accuracy;
  if (missed) {
    return { damage: 0, isCritical: false, missed: true, isStatus: false };
  }

  const isCritical = Math.random() < CRIT_CHANCE;
  const attackStat = move.category === "Physical" ? attacker.stats.attack : attacker.stats.spAttack;
  const defenseStat = move.category === "Physical" ? defender.stats.defense : defender.stats.spDefense;
  const level = 50;
  const randomFactor = MIN_RANDOM_FACTOR + Math.random() * (1 - MIN_RANDOM_FACTOR);
  const critMultiplier = isCritical ? 1.5 : 1;

  const rawDamage =
    (((2 * level) / 5 + 2) * move.power * (attackStat / defenseStat)) / 50 + 2;
  const damage = Math.max(1, Math.floor(rawDamage * critMultiplier * randomFactor));

  return { damage, isCritical, missed: false, isStatus: false };
}
