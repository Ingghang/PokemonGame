<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Battle UI</title>

    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#0F172A;
            line-height:1.6;
        }
        /* ---------- HEADER ---------- */

        .header{
            position:sticky;
            top:0;
            background:#111827;
            z-index:999;
            border-bottom:1px solid #1F2937;
        }

        .navbar{
            max-width:1200px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:1rem;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:10px;
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        .logo img{
            border-radius:50%;
        }

        .nav-links{
            display:flex;
            gap:1.5rem;
            list-style:none;
        }

        .nav-links a{
            color:#CBD5E1;
            text-decoration:none;
        }

        .nav-links a:hover,
        .nav-links a:focus{
            color:#FACC15;
        }

        .battleBody {
            display: flex;
            justify-content: center;
            align-items: center;
            /* min-height: 100vh; */
            margin: 0;
           
        } 

        .mainBorder {
            background-color: gray;
            width: 1000px;
            height: 800px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-radius: 20px;
            padding: 10px;
        }

        .upper {
            display: flex;
            width: 100%;
            height: 500px;
            position: relative;
            background-image: url("img/bbg.png");
            background-size: cover;
            background-position: center;
        }

        .upper p{
            font-size: 2rem;
            font-weight: 700;
            margin: 2px;
        }

        .pokemon1 {
            height: 250px;
            width: 250px;
            /* background-color: red; */
            position: absolute;
            top:50%;
            left:10%;
        }
        
        .pokemon1 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .pokemon1HP{
            display: flex;
            height: 100px;
            width: 500px;
            background-color: white;
            position: absolute;
            top:74%;
            right:1%;
            border-radius: 20px;
            border: black 5px solid;
            padding: 4px;
            flex-direction: column;
            justify-items: center;
            justify-content: center;
        }

        .p1hp_bg{
            width: 450px;
            height: 10px;
            background-color: black;
            border: gray 5px solid;
            border-radius: 20px;
        }

        .p1hp{
            width: 100%;
            height: 10px;
            background-color: green;
        }

        .pokemon2 {
            height: 250px;
            width: 250px;
            position:absolute;
            top:10%;
            right:10%;
        }

        .pokemon2 img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .pokemon2HP{
            display: flex;
            height: 100px;
            width: 500px;
            background-color: white;
            position: absolute;
            top:2%;
            left:1%;
            border-radius: 20px;
            border: black 5px solid;
            padding: 4px;
            flex-direction: column;
            justify-items: center;
            justify-content: center;
        }

        .p2hp_bg{
            width: 450px;
            height: 10px;
            background-color: black;
            border: gray 5px solid;
            border-radius: 20px;
        }

        .p2hp{
            width: 100%;
            height: 10px;
            background-color: green;
        }

        .bottom {
            display: flex;
            width: 100%;
            background-color:#282a2e ;
            height: 300px;
            padding: 0px;
            border: 4px solid black;
        }

        .dialogueBorder {
            background-color: #214f6b;
            border: 5px solid #ceaa48;
            color: white;
            font-size: 3rem;
            width: 50%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }


        .actionBorder {
           
            width: 50%;
            height: 300px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
        }

        .FightActionBorder {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
            width: 50%;
            height: 300px;
            display:none;
        }

        .itemActionBorder {
            display:none;
            flex-direction: column;
            width: 50%;
            height: auto;
        }

        .itemActionBorder button {
            margin: 20px;
            padding: 20px;
        }
        button {
            border: 8px solid black;
            border-radius: 12px;
            background-color: red;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }
    </style>
</head>

<body>
       <!-- Header -->
    <header class="header">
        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html" class="logo">
                <img src="img/logo.webp"
                    alt="Pokémon Battle Simulator logo"
                    width="48"
                    height="48">
                <span>Pokémon Battle Simulator</span>
            </a>
        </nav>
    </header>
    <div class="battleBody">
    <div class="mainBorder">
        <div class="upper" >
            <div class="pokemon1">
                <img src="img/pikachu.png" alt="sprite of pikachu">
            </div>
            <div class="pokemon1HP">
                    <p id="p1name">Pikachu</p>
                    <div class="p1hp_bg">
                        <div id="P1HP" class="p1hp"></div>
                    </div>
            </div>
            <div class="pokemon2">
                <img src="img/charizard1.png" alt="sprite of charizard">
            </div>
             <div class="pokemon2HP">
                <p id="p2name">Charizard</p>
                    <div class="p2hp_bg">
                        <div id="P2HP" class="p2hp"></div>
                </div>
            </div>
        </div>
        <div class="bottom">

            <div class="dialogueBorder" id="dialoguePannel">
                <p id="dialogue">What will you do ?</p>
            </div>

            <div class="actionBorder" id="actionPannel">
                 <button onclick="fight()">
                    Fight
                </button>

                <button onclick="pokemon()">
                    Pokemon
                </button>

                <button onclick="item()">
                    Item
                </button>

                <button onclick="run()">
                    Run
                </button>

            </div>
            <div class="FightActionBorder" id="fightActionPannel">
                 <button onclick="attack1()">
                    Volt Tackle
                </button>

                <button onclick="attack2()">
                    attack1
                </button>

                <button onclick="attack3()">
                    attack1
                </button>

                <button onclick="attack4()">
                    attack1
                </button>
                <button onclick="back()">
                    back
                </button>
            </div>
            <div class="itemActionBorder" id="itemActionPannel">
                <button onclick="potion()" id="potionText">Potion x3</button>
                <button onclick="back()">
                    back
                </button>
            </div>
        </div>

    </div>
    </div>
</body>
<script>

    let Pokemon= [  {
      "id": 25,
      "name": "Pikachu",
      "types": ["Electric"],
      "stats": {
        "hp": 110,
        "attack": 150,
        "defense": 60,
        "spAttack": 150,
        "spDefense": 70,
        "speed": 110
      },
      "moves": [
        {
          "name": "Fake Out",
          "type": "Normal",
          "category": "Physical",
          "power": 40,
          "accuracy": 100,
          "pp": 10
        },
        {
          "name": "Iron Tail",
          "type": "Steel",
          "category": "Physical",
          "power": 100,
          "accuracy": 75,
          "pp": 15
        },
        {
          "name": "Quick Attack",
          "type": "Normal",
          "category": "Physical",
          "power": 40,
          "accuracy": 100,
          "pp": 30
        },
        {
          "name": "Volt Tackle",
          "type": "Electric",
          "category": "Physical",
          "power": 120,
          "accuracy": 100,
          "pp": 15
        }
      ]
    },
    {
      "id": 6,
      "name": "Charizard",
      "types": ["Fire", "Flying"],
      "stats": {
        "hp": 153,
        "attack": 104,
        "defense": 98,
        "spAttack": 129,
        "spDefense": 105,
        "speed": 120
      },
      "moves": [
        {
          "name": "Flamethrower",
          "type": "Fire",
          "category": "Special",
          "power": 90,
          "accuracy": 100,
          "pp": 15
        },
        {
          "name": "Dragon Claw",
          "type": "Dragon",
          "category": "Physical",
          "power": 80,
          "accuracy": 100,
          "pp": 15
        },
        {
          "name": "Wing Attack",
          "type": "Flying",
          "category": "Physical",
          "power": 60,
          "accuracy": 100,
          "pp": 35
        },
        {
          "name": "Fire Blast",
          "type": "Fire",
          "category": "Special",
          "power": 110,
          "accuracy": 85,
          "pp": 5
        }
      ]
    }
    ]

    function fight(){
        console.log("fight button was pressed");
        document.getElementById("actionPannel").style.display="none";
        document.getElementById("fightActionPannel").style.display="grid";
    }

    const pikachu = Pokemon.find(p => p.name === "Pikachu");
    const charizard = Pokemon.find(p => p.name === "Charizard");

    let hp1=pikachu.stats.hp;
    let hp2=charizard.stats.hp;

    function attack1(){
        if (hp1==0){
            return;
        }
        let voltTackle = Pokemon[0].moves.find(move => move.name === "Volt Tackle");
        let basePower=voltTackle.power;
        let attackType=voltTackle.category;
        let attack=pikachu.stats.attack;
        let spAttack=pikachu.stats.spAttack;
        let defense=charizard.stats.defense;
        let spDefense=charizard.stats.spDefense;
        let maxHp=charizard.stats.hp;
        let dmg=0;
        let stab=false;
        let crit=false; 
        let prob=Math.floor(Math.random()*3);
        console.log(prob)
        if(prob==0){
            crit=true;
        }
        if (pikachu.types.includes(voltTackle.type)){
            stab=true;
        }
        if (attackType=="Physical"){
            dmg=getDmg(basePower,attack,defense);
        } else {
            dmg=getDmg(basePower,spAttack,spDefense);
        }
        
        console.log(dmg)
        hp2-=dmg;
        if (hp2<0){
            hp2=0;
          
        }
        
        document.getElementById("P2HP").style.width=(hp2/maxHp)*100+"%";
        document.getElementById("dialoguePannel").style.width="100%";
        document.getElementById("actionPannel").style.display="none";
        document.getElementById("fightActionPannel").style.display="none";
        document.getElementById("dialogue").textContent="Pikachu did a volt tackle";
        if(crit==true){
            setTimeout(Crit,1000);
        }
        setTimeout(oppdmg,500);
        setTimeout(back,2000);
        
    }

    function Crit(){
        document.getElementById("dialogue").textContent="It was a critial hit";
    }

    function oppdmg(){
    
    if (hp2==0){
        return
    }
    let charizardMove = charizard.moves[
        Math.floor(Math.random() * Pokemon[1].moves.length)
    ];

    console.log("Charizard used " + charizardMove.name);

    let basePower = charizardMove.power;
    let attackType = charizardMove.category;

    let attack = charizard.stats.attack;
    let spAttack = charizard.stats.spAttack;
    
    let maxHp= pikachu.stats.hp;
    let defense = pikachu.stats.defense;
    let spDefense = pikachu.stats.spDefense;

    let stab = false;
    let crit = false;

    let prob = Math.floor(Math.random() * 3);

    if (prob == 0) {
        crit = true;
    }

   
    if (charizard.types.includes(charizardMove.type)) {
        stab = true;
    }

    
    let dmg = 0;

    if (attackType == "Physical") {
        dmg = getDmg(
            basePower,
            attack,
            defense,
            stab,
            crit
        );
    } else {
        dmg = getDmg(
            basePower,
            spAttack,
            spDefense,
            stab,
            crit
        );
    }

    console.log("Damage:", dmg);

    hp1 -= dmg;

    if (hp1 < 0) {
        hp1 = 0;
    }

        document.getElementById("P1HP").style.width=(hp1/maxHp)*100+"%";
        document.getElementById("dialoguePannel").style.width="100%";
        document.getElementById("actionPannel").style.display="none";
        document.getElementById("fightActionPannel").style.display="none";
        document.getElementById("dialogue").textContent="Charizad did a "+ charizardMove.name;
        if(crit==true){
            setTimeout(Crit,1000);
        }

    console.log("Pikachu HP:", hp1);
    }

    function getDmg(basePower,attack,defense,stab,crit){
       let tmp =((22*basePower*(attack/defense))/50+2);
       if(stab==true){
            tmp=tmp*1.5;
       }
       if(crit==true){
            tmp=tmp*1.5;
       }
       return tmp;
    }


    function back(){
        let fight=document.getElementById("fightActionPannel").style.display;
        let item=document.getElementById("itemActionPannel").style.display
        if(fight==="grid"){
            document.getElementById("fightActionPannel").style.display="none";
        } else if (item==="flex"){
         document.getElementById("itemActionPannel").style.display="none";
        }
        document.getElementById("actionPannel").style.display="grid";
        document.getElementById("dialoguePannel").style.width="50%";
        document.getElementById("dialogue").textContent="What will you do?"
    }
    
    function pokemon(){
        document.getElementById("dialoguePannel").style.width="100%";
        document.getElementById("actionPannel").style.display="none";
        document.getElementById("dialogue").textContent="You don't have other pokemon";
        setTimeout(back,2000);
    }
    function item(){
        document.getElementById("itemActionPannel").style.display="flex";
        document.getElementById("actionPannel").style.display="none";
    }

    //no of potions
   let potionCount = 3;
   
    function potion() {
        const maxHp = pikachu.stats.hp;
        
        if (potionCount > 0) {
            hp1 += 30;

            if (hp1 > maxHp) {
                hp1 = maxHp;
            }

            potionCount--;

            let tmp = (hp1 / maxHp) * 100;
            let hpBar=tmp+"%";
            console.log(tmp);
            console.log(typeof hpBar);
            document.getElementById("P1HP").style.width = hpBar;
            document.getElementById("potionText").textContent="Potion x"+potionCount;
            back();
        }else{
            document.getElementById("itemActionPannel").style.display="none"
            document.getElementById("dialoguePannel").style.width="100%";
            document.getElementById("dialogue").textContent="You don't have potion left";
            setTimeout(back,1500);
        }

    }



    function run(){
        document.getElementById("dialogue").textContent="You can't run from a pokemon battle"
    }
    const text = document.getElementById("dialogue");


    
</script>
</html>
